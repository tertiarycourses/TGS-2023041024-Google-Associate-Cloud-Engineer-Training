apiVersion: apps/v1
kind: Deployment
metadata: {name: ace-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: ace-web}}
  template:
    metadata: {labels: {app: ace-web}}
    spec:
      containers:
      - name: web
        image: us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: ace-web}
spec: {selector: {app: ace-web}, ports: [{port: 80, targetPort: 8080}]}
